openapi: 3.1.0
info:
  title: AmplifAI content engine
  version: 3.0.0
  description: |
    Writes the guides for AmplifAI products. The AmplifAI tool sends a product, the shop's brand knowledge and settings;
    the engine researches, writes the three guides (ordered, in_transit, delivered) in the tool's own guide format
    (guideContentSchema), checks them and returns them. The tool saves them with save_guide_content.
    Writing and revising run as jobs: answer 202 with the job, then poll GET /v1/content/{id}, pass callbackUrl,
    or pass wait to get 200 with the finished job.
    Errors are `{ "error": "…", "field"?: "…", "code"?: "…" }` with a fitting status code (messages in Dutch).
    402 with `code: "budget"` means a spending limit was reached (live mode only).
servers:
  - url: http://localhost:4317
security:
  - bearer: []
tags:
  - { name: tool, description: "The AmplifAI tool: TOOL_API_KEY, or TOOL_TEST_KEY for the same calls with free test texts (also works with the admin key)" }
  - { name: admin, description: "AmplifAI only: ADMIN_API_KEY" }

paths:
  /v1/health:
    get: { summary: Up, and test or live, security: [], responses: { '200': { description: "{ ok, mode: test|live, ai }" } } }

  /v1/options:
    get:
      tags: [tool]
      summary: The settings the tool can send, the quality levels and the pieces of content
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Options' } } } }

  /v1/content:
    post:
      tags: [tool]
      summary: Write the three guides for one product
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WriteRequest' } } }
      responses:
        '200': { description: "Finished (with wait)", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '202': { description: "Started", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '402': { description: "A spending limit is reached (code: budget)" }
        '409': { description: "Live mode without an Anthropic key" }
        '422': { description: "Invalid input; field says which" }

  /v1/content/revise:
    post:
      tags: [tool]
      summary: Rewrite one piece of earlier content, with the shop's wish
      description: |
        The result is the whole set with the piece rewritten; the tool stores it in place of the old one. Question and
        answer ids and each answer's next stay.
        The wish is added to the sources as a fact (w1, w2, …) so what the shop says about its own product can be cited.
        The AmplifAI rules always win over the wish.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviseRequest' } } }
      responses:
        '200': { description: "Finished (with wait)", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '202': { description: "Started", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '402': { description: "A spending limit is reached (code: budget)" }
        '422': { description: "Invalid input; field says which (content, piece, wish, settings.languages)" }

  /v1/content/check:
    post:
      tags: [tool]
      summary: Hold guides against the AmplifAI rules and the tool's limits (free, instant)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content], properties: { content: { $ref: '#/components/schemas/Result' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Quality' } } } }

  /v1/content/{id}:
    get:
      tags: [tool]
      summary: A job and, when done, its result (kept for KEEP_DAYS, default 7)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, description: "Only this language's guides", schema: { type: string, enum: [nl, en, de, fr] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { description: "Unknown, or older than KEEP_DAYS" }

  /v1/admin/status:
    get:
      tags: [admin]
      summary: Test or live, the key, spending, levels, keys for the tool, recent jobs
      responses: { '200': { description: OK } }
  /v1/admin/ai:
    put:
      tags: [admin]
      summary: Set the Anthropic key (checked for free first, never sent back) or switch test/live
      requestBody: { content: { application/json: { schema: { type: object, properties: { key: { type: [string, 'null'] }, mode: { type: string, enum: [test, live] } } } } } }
      responses: { '200': { description: The new status }, '409': { description: "Live without a key" }, '422': { description: "Key refused" } }
  /v1/admin/settings:
    patch:
      tags: [admin]
      summary: Spending limits, the model behind each quality level, the general instructions and the defaults for shops
      description: For instructions and defaults, null for a field puts back the built-in default. GET /v1/admin/status returns instructionFields and settingFields to draw the form.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                budget: { $ref: '#/components/schemas/Budget' }
                instructions:
                  type: object
                  properties:
                    factsMin: { type: integer, minimum: 5, maximum: 40, default: 18 }
                    factsMax: { type: integer, minimum: 8, maximum: 60, default: 30 }
                    questionIdeas: { type: integer, minimum: 1, maximum: 5, default: 3 }
                    maxSearches: { type: integer, minimum: 0, maximum: 15, default: 8 }
                    maxFetches: { type: integer, minimum: 0, maximum: 10, default: 6 }
                    blockedDomains: { type: array, items: { type: string } }
                    effort: { type: string, enum: [low, medium, high, xhigh], default: high }
                    extra: { type: string, maxLength: 2000, description: Extra instruction for all writing }
                    rules: { type: array, items: { type: string }, maxItems: 30, description: The fixed rules in every writing prompt }
                    researchBrief: { type: string, description: "The research instruction; {factsMin}, {factsMax}, {questionIdeas} are filled in" }
                    writerIntro: { type: string }
                    shortLength: { type: string }
                    defaultTone: { type: string, description: Used when the tool sends no toneOfVoice }
                    momentOrdered: { type: string }
                    momentInTransit: { type: string }
                    momentDelivered: { type: string }
                    pieceIntro: { type: string }
                    pieceQuestions: { type: string, description: "{questionCount} and {answerCount} are filled in" }
                    pieceTips: { type: string, description: "{tipCount} is filled in" }
                    checks: { type: object, description: "Per check (missing, sell, delivery, returns, form, source, fit, flow, long, count, repeat): error, warn or off", additionalProperties: { type: string, enum: [error, warn, off] } }
                    sellWords: { type: array, items: { type: string } }
                    deliveryWords: { type: array, items: { type: string }, description: "# stands for a number" }
                    returnsWords: { type: array, items: { type: string } }
                    maxIntro: { type: integer, default: 400 }
                    maxTip: { type: integer, default: 280 }
                    maxQuestion: { type: integer, default: 120 }
                    maxAnswer: { type: integer, default: 60 }
                    maxReply: { type: integer, default: 240 }
                defaults: { $ref: '#/components/schemas/Settings' }
                levels:
                  type: object
                  additionalProperties: { type: object, properties: { model: { type: string, enum: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-1] } } }
      responses: { '200': { description: The new status } }
  /v1/admin/prompt:
    get:
      tags: [admin]
      summary: The full research and writing instruction exactly as Claude gets it, for shop settings in the query (e.g. toneOfVoice=…&languages=nl,en)
      responses: { '200': { description: "{ settings, research, writing }" } }
  /v1/admin/stop:
    post:
      tags: [admin]
      summary: "Emergency stop: back to test mode, waiting jobs cancelled, running ones stop at their next call to Claude"
      responses: { '200': { description: "{ mode: test, cancelled, stillRunning }" } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "TOOL_API_KEY, TOOL_TEST_KEY or ADMIN_API_KEY" }
  schemas:
    Settings:
      type: object
      description: The shop's settings. Missing ones get the default from GET /v1/options. Counts are per moment.
      properties:
        languages: { type: array, items: { type: string, enum: [nl, en, de, fr] }, minItems: 1, default: [nl], description: The first is written first and most carefully }
        quality: { type: string, enum: [basis, plus, premium], default: basis }
        toneOfVoice: { type: string, maxLength: 2000, description: "The shop's tone of voice as the tool stores it (brand_profiles.tone_of_voice). Empty: AmplifAI's default tone" }
        formality: { type: string, enum: [auto, informal, formal], default: auto, description: "auto reads it from the tone of voice (\"address the customer formally\" means u/uw)" }
        length: { type: string, enum: [standard, short], default: standard }
        tipCount: { type: integer, minimum: 1, maximum: 5, default: 3 }
        questionCount: { type: integer, minimum: 0, maximum: 3, default: 2 }
        answerCount: { type: integer, minimum: 2, maximum: 5, default: 3 }

    Product:
      type: object
      description: What the tool knows. name and description, or a url the engine can read them from.
      properties:
        name: { type: string }
        description: { type: string, maxLength: 20000 }
        url: { type: string, format: uri, description: Optional; the engine reads the page too when name or description is thin }
        sku: { type: string }
        brand: { type: string }
        category: { type: string }
        price: { type: string, example: "€89,95" }
        specs: { type: array, items: { type: string } }
        variants: { type: array, items: { type: string } }
        image: { type: string, format: uri }
        gtin: { type: string }

    Brand:
      type: object
      description: "The shop's brand knowledge (the tool's brand_about, brand_expertise, brand_sources). Becomes facts s1, s2, … cited as the shop's word."
      properties:
        story: { type: string }
        audience: { type: string }
        usps: { type: array, items: { type: string }, maxItems: 5 }
        expertise: { type: array, items: { type: object, properties: { title: { type: string }, body: { type: string }, sourceId: { type: string }, url: { type: string }, enabled: { type: boolean } } } }
        sources: { type: array, items: { type: object, properties: { id: { type: string }, label: { type: string }, url: { type: string } } } }

    JobOptions:
      type: object
      properties:
        reference: { type: string, maxLength: 200, description: "The tool's own id (e.g. the product id); comes back on the job" }
        callbackUrl: { type: string, format: uri, description: "POSTed { event: content.done|content.failed|content.cancelled, at, job } when finished, signed in x-amplifai-signature (HMAC-SHA256 with the callback secret)" }
        wait: { oneOf: [{ type: boolean }, { type: number }], description: "Answer when finished: true waits up to 90 s, a number up to that many seconds" }

    WriteRequest:
      allOf:
        - $ref: '#/components/schemas/JobOptions'
        - type: object
          required: [product]
          properties:
            product: { $ref: '#/components/schemas/Product' }
            shop: { type: object, properties: { name: { type: string }, url: { type: string } } }
            brand: { $ref: '#/components/schemas/Brand' }
            settings: { $ref: '#/components/schemas/Settings' }

    ReviseRequest:
      allOf:
        - $ref: '#/components/schemas/JobOptions'
        - type: object
          required: [content, piece]
          properties:
            content: { $ref: '#/components/schemas/Result' }
            piece: { type: string, description: 'ordered | in_transit | delivered (a whole guide), ordered.intro, ordered.tips.1, ordered.questions.0, ordered.questions.0.answers.2' }
            wish: { type: string, maxLength: 600, description: "The shop's words; empty for simply another version" }
            settings: { $ref: '#/components/schemas/Settings', description: "Optional new settings for this rewrite; languages must stay the same" }

    Job:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [write, revise] }
        reference: { type: [string, 'null'] }
        test: { type: boolean, description: Test texts (test key or test mode) }
        status: { type: string, enum: [queued, working, done, failed, cancelled] }
        progress: { type: array, items: { type: object, properties: { at: { type: string }, msg: { type: string } } } }
        error: { type: [string, 'null'] }
        code: { type: string, description: '"budget" when a spending limit stopped it' }
        result: { oneOf: [{ $ref: '#/components/schemas/Result' }, { type: 'null' }] }
        createdAt: { type: string }
        startedAt: { type: [string, 'null'] }
        finishedAt: { type: [string, 'null'] }

    Result:
      type: object
      description: What the tool stores. Send it back whole (with the current texts in guides) for a revision or a check.
      properties:
        formatVersion: { const: 3 }
        test: { type: boolean }
        languages: { type: array, items: { type: string } }
        settings: { $ref: '#/components/schemas/Settings' }
        product: { type: object, description: "The product as the engine used it: url, name, brand, category, price, image, variants, sku" }
        shop: { type: object }
        guides:
          type: object
          description: "Per language, per moment: the tool's GuideContent, ready for save_guide_content(product_id, moment, content)"
          additionalProperties:
            type: object
            properties:
              ordered: { $ref: '#/components/schemas/ToolGuide' }
              in_transit: { $ref: '#/components/schemas/ToolGuide' }
              delivered: { $ref: '#/components/schemas/ToolGuide' }
        citations:
          type: object
          description: 'Source ids per text: "ordered.intro", "ordered.tips.0", "ordered.questions.0.answers.1"'
          additionalProperties: { type: array, items: { type: string } }
        sources:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: "f1, f2, … from research; s1, s2, … from the shop's brand knowledge; w1, w2, … from the shop's wishes" }
              category: { type: string }
              claim: { type: string }
              url: { type: [string, 'null'], description: null for facts from the tool's own product text }
              title: { type: string }
              used: { type: boolean, description: Cited by a text }
        quality: { $ref: '#/components/schemas/Quality' }
        costEUR: { type: number, description: "What this job cost AmplifAI at Anthropic" }
        research: { type: object, description: "Engine notes for revisions; send back unchanged" }
        revised: { type: object, properties: { piece: { type: string }, wish: { type: [string, 'null'] } } }
        createdAt: { type: string }

    ToolGuide:
      type: object
      description: "Exactly the tool's guideContentSchema (src/features/guides/schemas.ts in the tool)"
      properties:
        intro: { type: string, maxLength: 2000 }
        tips: { type: array, minItems: 1, maxItems: 5, items: { type: string, maxLength: 1000 } }
        questions:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              question: { type: string, maxLength: 300 }
              answers:
                type: array
                minItems: 2
                maxItems: 5
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    label: { type: string, maxLength: 200 }
                    reply: { type: [string, 'null'], maxLength: 500 }
                    next: { type: string, description: '"next", "end", or the id of a later question' }

    Quality:
      type: object
      properties:
        ok: { type: boolean, description: No rule broken }
        errors: { type: integer }
        warnings: { type: integer }
        issues:
          type: array
          items:
            type: object
            properties:
              piece: { type: string, description: "The piece's path (as in citations), or a whole moment" }
              level: { type: string, enum: [error, warn] }
              code: { type: string, enum: [missing, sell, delivery, returns, form, source, fit, flow, long, count, repeat] }
              message: { type: string }

    Options:
      type: object
      properties:
        formatVersion: { const: 3 }
        settings: { type: object, description: "Per setting: type, label, help, default, options, min, max" }
        languages: { type: object, additionalProperties: { type: string } }
        qualities: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, blurb: { type: string }, estimatedCostEUR: { type: number } } } }
        moments: { type: array, items: { type: object, properties: { id: { type: string, enum: [ordered, in_transit, delivered] }, label: { type: string } } } }
        pieces: { type: array, items: { type: object, properties: { path: { type: string }, label: { type: string } } } }

    Budget:
      type: object
      properties:
        dayEUR: { type: number, default: 5 }
        monthEUR: { type: number, default: 25 }
        productEUR: { type: number, default: 2 }
