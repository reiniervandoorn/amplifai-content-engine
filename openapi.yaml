openapi: 3.1.0
info:
  title: AmplifAI content engine
  version: 2.0.0
  description: |
    Writes the content for AmplifAI product guides. The AmplifAI tool sends a product and the shop's settings;
    the engine researches, writes, checks and returns the content. The tool stores it and builds the guide.
    Writing and revising run as jobs: answer 202 with the job, then poll GET /v1/content/{id}, pass callbackUrl,
    or pass wait to get 200 with the finished job.
    Errors are `{ "error": "…", "field"?: "…", "code"?: "…" }` with a fitting status code (messages in Dutch).
    402 with `code: "budget"` means a spending limit was reached (live mode only).
servers:
  - url: http://localhost:4317
security:
  - bearer: []
tags:
  - { name: tool, description: "The AmplifAI tool: TOOL_API_KEY, or TOOL_TEST_KEY for the same calls with free test texts (also works with the admin key)" }
  - { name: admin, description: "AmplifAI only: ADMIN_API_KEY" }

paths:
  /v1/health:
    get: { summary: Up, and test or live, security: [], responses: { '200': { description: "{ ok, mode: test|live, ai }" } } }

  /v1/options:
    get:
      tags: [tool]
      summary: The settings the tool can send, the quality levels and the pieces of content
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Options' } } } }

  /v1/content:
    post:
      tags: [tool]
      summary: Write the content for one product
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WriteRequest' } } }
      responses:
        '200': { description: "Finished (with wait)", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '202': { description: "Started", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '402': { description: "A spending limit is reached (code: budget)" }
        '409': { description: "Live mode without an Anthropic key" }
        '422': { description: "Invalid input; field says which" }

  /v1/content/revise:
    post:
      tags: [tool]
      summary: Rewrite one piece of earlier content, with the shop's wish
      description: |
        The result is the whole content with the piece rewritten; the tool stores it in place of the old one.
        The wish is added to the sources as a fact (w1, w2, …) so what the shop says about its own product can be cited.
        The AmplifAI rules always win over the wish.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviseRequest' } } }
      responses:
        '200': { description: "Finished (with wait)", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '202': { description: "Started", content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '402': { description: "A spending limit is reached (code: budget)" }
        '422': { description: "Invalid input; field says which (content, piece, wish, settings.languages)" }

  /v1/content/check:
    post:
      tags: [tool]
      summary: Hold content against the AmplifAI rules (free, instant)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [content], properties: { content: { $ref: '#/components/schemas/Result' } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Quality' } } } }

  /v1/content/{id}:
    get:
      tags: [tool]
      summary: A job and, when done, its result (kept for KEEP_DAYS, default 7)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: lang, in: query, description: "Every text as a plain string in this language", schema: { type: string, enum: [nl, en, de, fr] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { description: "Unknown, or older than KEEP_DAYS" }

  /v1/admin/status:
    get:
      tags: [admin]
      summary: Test or live, the key, spending, levels, keys for the tool, recent jobs
      responses: { '200': { description: OK } }
  /v1/admin/ai:
    put:
      tags: [admin]
      summary: Set the Anthropic key (checked for free first, never sent back) or switch test/live
      requestBody: { content: { application/json: { schema: { type: object, properties: { key: { type: [string, 'null'] }, mode: { type: string, enum: [test, live] } } } } } }
      responses: { '200': { description: The new status }, '409': { description: "Live without a key" }, '422': { description: "Key refused" } }
  /v1/admin/settings:
    patch:
      tags: [admin]
      summary: Spending limits, the model behind each quality level, the general instructions and the defaults for shops
      description: For instructions and defaults, null for a field puts back the built-in default. GET /v1/admin/status returns instructionFields and settingFields to draw the form.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                budget: { $ref: '#/components/schemas/Budget' }
                instructions:
                  type: object
                  properties:
                    factsMin: { type: integer, minimum: 5, maximum: 40, default: 18 }
                    factsMax: { type: integer, minimum: 8, maximum: 60, default: 30 }
                    questionIdeas: { type: integer, minimum: 1, maximum: 5, default: 3 }
                    maxSearches: { type: integer, minimum: 0, maximum: 15, default: 8 }
                    maxFetches: { type: integer, minimum: 0, maximum: 10, default: 6 }
                    blockedDomains: { type: array, items: { type: string } }
                    specialCount: { type: integer, minimum: 1, maximum: 4, default: 2 }
                    careCount: { type: integer, minimum: 1, maximum: 5, default: 3 }
                    headlineWords: { type: integer, minimum: 4, maximum: 12, default: 8 }
                    effort: { type: string, enum: [low, medium, high, xhigh], default: high }
                    extra: { type: string, maxLength: 2000, description: Extra instruction for all writing }
                    rules: { type: array, items: { type: string }, maxItems: 30, description: The fixed rules in every writing prompt }
                    researchBrief: { type: string, description: "The research instruction; {factsMin}, {factsMax}, {questionIdeas} are filled in" }
                    writerIntro: { type: string }
                    shortLength: { type: string }
                    toneWarm: { type: string }
                    toneNeutral: { type: string }
                    toneExpert: { type: string }
                    tonePlayful: { type: string }
                    pieceIntro: { type: string, description: "One line per piece; also pieceStory, pieceSpecial, pieceExpect, pieceFact, pieceCare, pieceExperience, pieceQuestion, pieceTips, pieceWhileYouWait, pieceFirstMinutes" }
                    checks: { type: object, description: "Per check (missing, sell, delivery, returns, form, source, answer, keys, long, headline, count, repeat): error, warn or off", additionalProperties: { type: string, enum: [error, warn, off] } }
                    sellWords: { type: array, items: { type: string } }
                    deliveryWords: { type: array, items: { type: string }, description: "# stands for a number" }
                    returnsWords: { type: array, items: { type: string } }
                    maxHeadline: { type: integer }
                    maxTitle: { type: integer }
                    maxLead: { type: integer }
                    maxStory: { type: integer }
                    maxText: { type: integer }
                    maxLine: { type: integer }
                defaults: { $ref: '#/components/schemas/Settings' }
                levels:
                  type: object
                  additionalProperties: { type: object, properties: { model: { type: string, enum: [claude-haiku-5-5, claude-sonnet-5-5, claude-opus-5-5, claude-fable-5-1] } } }
      responses: { '200': { description: The new status } }
  /v1/admin/prompt:
    get:
      tags: [admin]
      summary: The full research and writing instruction exactly as Claude gets it, for shop settings in the query (e.g. tone=playful&languages=nl,en)
      responses: { '200': { description: "{ settings, research, writing }" } }
  /v1/admin/stop:
    post:
      tags: [admin]
      summary: "Emergency stop: back to test mode, waiting jobs cancelled, running ones stop at their next call to Claude"
      responses: { '200': { description: "{ mode: test, cancelled, stillRunning }" } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "TOOL_API_KEY, TOOL_TEST_KEY or ADMIN_API_KEY" }
  schemas:
    Text:
      type: object
      description: 'One text in every language of the result, e.g. { "nl": "…", "en": "…" }'
      additionalProperties: { type: string }
    Src: { type: array, items: { type: string }, description: 'Ids of the sources this rests on, e.g. ["f3"]' }
    Icon: { type: string, description: "A suggested icon from GET /v1/options icons; the tool may ignore it" }
    Point:
      type: object
      properties: { icon: { $ref: '#/components/schemas/Icon' }, lead: { $ref: '#/components/schemas/Text' }, text: { $ref: '#/components/schemas/Text' }, src: { $ref: '#/components/schemas/Src' } }
    Tip:
      type: object
      properties: { icon: { $ref: '#/components/schemas/Icon' }, title: { $ref: '#/components/schemas/Text' }, text: { $ref: '#/components/schemas/Text' }, src: { $ref: '#/components/schemas/Src' } }
    Moment:
      type: object
      properties: { title: { $ref: '#/components/schemas/Text' }, items: { type: array, items: { $ref: '#/components/schemas/Point' } } }

    Settings:
      type: object
      description: The shop's toggles. Missing ones get the default from GET /v1/options.
      properties:
        languages: { type: array, items: { type: string, enum: [nl, en, de, fr] }, minItems: 1, default: [nl, en], description: The first is written first and most carefully }
        quality: { type: string, enum: [basis, plus, premium], default: basis }
        tone: { type: string, enum: [warm, neutral, expert, playful], default: warm }
        formality: { type: string, enum: [informal, formal], default: informal, description: "je/du/tu or u/Sie/vous" }
        length: { type: string, enum: [standard, short], default: standard }
        tipCount: { type: integer, minimum: 2, maximum: 4, default: 3, description: Tips per experience level }
        answerCount: { type: integer, minimum: 3, maximum: 4, default: 4 }
        expectCount: { type: integer, minimum: 2, maximum: 3, default: 2 }
        emailItems: { type: integer, minimum: 2, maximum: 4, default: 3 }
        style: { type: string, maxLength: 400, description: "The shop's style wish; it cannot change the AmplifAI rules" }

    Product:
      type: object
      required: [url]
      description: What the tool knows. Whatever is missing is read from the product page.
      properties:
        url: { type: string, format: uri }
        name: { type: string }
        brand: { type: string }
        category: { type: string }
        price: { type: string, example: "€89,95" }
        description: { type: string, maxLength: 8000 }
        specs: { type: array, items: { type: string } }
        variants: { type: array, items: { type: string } }
        image: { type: string, format: uri }
        sku: { type: string }
        gtin: { type: string }

    JobOptions:
      type: object
      properties:
        reference: { type: string, maxLength: 200, description: "The tool's own id; comes back on the job" }
        callbackUrl: { type: string, format: uri, description: "POSTed { event: content.done|content.failed|content.cancelled, at, job } when finished, signed in x-amplifai-signature (HMAC-SHA256 with the callback secret)" }
        wait: { oneOf: [{ type: boolean }, { type: number }], description: "Answer when finished: true waits up to 90 s, a number up to that many seconds" }

    WriteRequest:
      allOf:
        - $ref: '#/components/schemas/JobOptions'
        - type: object
          required: [product]
          properties:
            product: { $ref: '#/components/schemas/Product' }
            shop: { type: object, properties: { name: { type: string }, url: { type: string } } }
            settings: { $ref: '#/components/schemas/Settings' }

    ReviseRequest:
      allOf:
        - $ref: '#/components/schemas/JobOptions'
        - type: object
          required: [content, piece]
          properties:
            content: { $ref: '#/components/schemas/Result' }
            piece: { type: string, description: 'Path of the piece, e.g. "story", "tips.new.1", "question.options.2"; see GET /v1/options pieces' }
            wish: { type: string, maxLength: 600, description: "The shop's words; empty for simply another version" }
            settings: { $ref: '#/components/schemas/Settings', description: "Optional new settings for this rewrite; languages must stay the same" }

    Job:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [write, revise] }
        reference: { type: [string, 'null'] }
        test: { type: boolean, description: Test texts (test key or test mode) }
        status: { type: string, enum: [queued, working, done, failed, cancelled] }
        progress: { type: array, items: { type: object, properties: { at: { type: string }, msg: { type: string } } } }
        error: { type: [string, 'null'] }
        code: { type: string, description: '"budget" when a spending limit stopped it' }
        result: { oneOf: [{ $ref: '#/components/schemas/Result' }, { type: 'null' }] }
        createdAt: { type: string }
        startedAt: { type: [string, 'null'] }
        finishedAt: { type: [string, 'null'] }

    Result:
      type: object
      description: What the tool stores. Send it back whole for a revision or a check.
      properties:
        formatVersion: { const: 2 }
        test: { type: boolean }
        languages: { type: array, items: { type: string } }
        settings: { $ref: '#/components/schemas/Settings' }
        product: { type: object, description: "The product as the engine used it: url, name, brand, category, price, image, variants" }
        shop: { type: object }
        content: { $ref: '#/components/schemas/Content' }
        sources:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: "f1, f2, … from research; w1, w2, … from the shop's wishes" }
              category: { type: string }
              claim: { type: string }
              url: { type: string }
              title: { type: string }
              used: { type: boolean, description: Cited by the content }
        quality: { $ref: '#/components/schemas/Quality' }
        costEUR: { type: number, description: "What this job cost AmplifAI at Anthropic" }
        research: { type: object, description: "Engine notes for revisions; send back unchanged" }
        revised: { type: object, properties: { piece: { type: string }, wish: { type: [string, 'null'] } } }
        createdAt: { type: string }

    Content:
      type: object
      description: The pieces. The tool decides where each goes in the guide.
      properties:
        shortName: { $ref: '#/components/schemas/Text' }
        intro:
          type: object
          properties:
            title: { $ref: '#/components/schemas/Text' }
            headline: { $ref: '#/components/schemas/Text', description: At most 8 words }
            teaser: { type: object, description: Invites the customer to open the guide, properties: { headline: { $ref: '#/components/schemas/Text' }, line: { $ref: '#/components/schemas/Text' } } }
        story: { type: object, description: The brand story, properties: { text: { $ref: '#/components/schemas/Text' }, src: { $ref: '#/components/schemas/Src' } } }
        special: { type: array, items: { $ref: '#/components/schemas/Tip' }, description: What makes this product special }
        expect: { type: array, items: { $ref: '#/components/schemas/Point' }, description: What is normal in the first days }
        fact: { type: object, properties: { icon: { $ref: '#/components/schemas/Icon' }, text: { $ref: '#/components/schemas/Text' }, src: { $ref: '#/components/schemas/Src' } } }
        care: { type: array, items: { $ref: '#/components/schemas/Tip' } }
        experience:
          type: object
          properties: { question: { $ref: '#/components/schemas/Text' }, new: { $ref: '#/components/schemas/Text' }, regular: { $ref: '#/components/schemas/Text' }, expert: { $ref: '#/components/schemas/Text' } }
        question:
          type: object
          properties:
            eyebrow: { $ref: '#/components/schemas/Text' }
            title: { $ref: '#/components/schemas/Text' }
            sub: { $ref: '#/components/schemas/Text' }
            options:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { $ref: '#/components/schemas/Text' }
                  note: { $ref: '#/components/schemas/Text' }
                  ok: { type: boolean, description: false when the customer should check or do something first }
                  result: { type: object, properties: { headline: { $ref: '#/components/schemas/Text' }, lines: { type: array, items: { $ref: '#/components/schemas/Text' } } } }
                  tip: { type: object, properties: { icon: { $ref: '#/components/schemas/Icon' }, title: { $ref: '#/components/schemas/Text' }, text: { $ref: '#/components/schemas/Text' }, why: { $ref: '#/components/schemas/Text' } } }
                  src: { $ref: '#/components/schemas/Src' }
        tips:
          type: object
          properties:
            new: { type: array, items: { $ref: '#/components/schemas/Tip' } }
            regular: { type: array, items: { $ref: '#/components/schemas/Tip' } }
            expert: { type: array, items: { $ref: '#/components/schemas/Tip' } }
        whileYouWait: { $ref: '#/components/schemas/Moment', description: For the shipping email }
        firstMinutes: { $ref: '#/components/schemas/Moment', description: For the delivery email }

    Quality:
      type: object
      properties:
        ok: { type: boolean, description: No rule broken }
        errors: { type: integer }
        warnings: { type: integer }
        issues:
          type: array
          items:
            type: object
            properties:
              piece: { type: string, description: The piece's path }
              level: { type: string, enum: [error, warn] }
              code: { type: string, enum: [missing, sell, delivery, returns, form, source, long, headline, count, answer, keys, repeat] }
              message: { type: string }

    Options:
      type: object
      properties:
        formatVersion: { const: 2 }
        settings: { type: object, description: "Per setting: type, label, help, default, options, min, max" }
        languages: { type: object, additionalProperties: { type: string } }
        qualities: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, blurb: { type: string }, estimatedCostEUR: { type: number } } } }
        pieces: { type: array, items: { type: object, properties: { path: { type: string }, label: { type: string } } } }
        icons: { type: array, items: { type: string } }

    Budget:
      type: object
      properties:
        dayEUR: { type: number, default: 5 }
        monthEUR: { type: number, default: 25 }
        productEUR: { type: number, default: 2 }
