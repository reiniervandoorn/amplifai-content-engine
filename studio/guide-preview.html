<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AmplifAI Live Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800&family=Barlow+Condensed:wght@700&family=Bitter:wght@700&family=Playfair+Display:ital,wght@1,700&family=Sora:wght@700&display=swap">
<style>
:root{
  --stage:#ECEBE7; --stage2:#F7F6F3; --ink:#141416; --sub:#6B6B72; --mut:#A3A3AA; --line:rgba(20,20,22,.08);
  --fill:#F4F4F6; --ok:#1E8A4F; --okbg:#E7F5EC; --warn:#B46A14; --warnbg:#FBF0E1;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 50% 45%,var(--stage2),var(--stage));color:var(--ink);font-family:var(--sys);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid #2F6FED;outline-offset:2px}
.i{display:block;flex-shrink:0}

/* ───────── presenter ───────── */
.app{display:flex;flex-direction:column;min-height:100%}
.bar{position:relative;z-index:30;display:flex;align-items:center;gap:10px;padding-block:14px;padding-inline:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:700;letter-spacing:-.02em;margin-right:6px}
.brand .mk{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.bar .seg{flex-shrink:0}
@media (max-width:1600px){.brand small{display:none}}
.brand small{font-weight:500;color:var(--mut);font-size:13px;letter-spacing:0;margin-left:2px}
.spacer{flex:1}
.seg{display:flex;background:rgba(20,20,22,.06);border-radius:12px;padding:3px;gap:2px}
.seg button{font-size:13px;font-weight:500;color:var(--sub);border-radius:9px;padding:7px 10px;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04)}
.seg button:hover:not(.on){color:var(--ink)}
.tbtn{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sub);padding:8px 12px;border-radius:11px;transition:background .2s,color .2s}
.tbtn:hover,.tbtn.on{color:var(--ink);background:rgba(20,20,22,.06)}
.nsw{width:26px;height:16px;border-radius:99px;background:#D6D6DB;position:relative;transition:background .2s}
.nsw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.nsw.on{background:#2E8B57}.nsw.on::after{transform:translateX(10px)}
.tbtn .sw0{width:12px;height:12px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}

.pop{position:absolute;top:60px;right:22px;width:320px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.05);display:none;z-index:40}
.pop.show{display:block;animation:popin .28s var(--spring) both}
@keyframes popin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.ptitle{font-size:16px;font-weight:700;letter-spacing:-.01em}
.psub{font-size:12.5px;color:var(--sub);margin:3px 0 14px;line-height:1.45}
.fl{font-size:12px;font-weight:600;color:var(--sub);margin:14px 0 7px}
.fin{width:100%;height:42px;border-radius:11px;border:1px solid #DCDCE1;padding:0 12px;font:inherit;font-size:14.5px;color:var(--ink);background:#fff}
.fin:disabled{background:#F6F6F8;color:var(--mut)}
.sws{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sws button{width:28px;height:28px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);transition:transform .15s}
.sws button:hover{transform:scale(1.08)}
.sws button.on{outline:2px solid var(--ink);outline-offset:2px}
.sws input[type=color]{width:28px;height:28px;border:0;padding:0;border-radius:99px;overflow:hidden;cursor:pointer;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sws input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.sws input[type=color]::-webkit-color-swatch{border:0;border-radius:99px;opacity:0}
.sws input[type=color]::-moz-color-swatch{border:0;opacity:0}
.pop .seg button,.dsec .seg button{flex:1}
.dis{opacity:.4;pointer-events:none}

.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:44px;padding-block:4px 26px;padding-inline:28px}
.side{max-width:290px;width:100%}
.side.l{justify-self:end}
.side.r{justify-self:start}
.pcard{background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.plabel{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.who b{display:block;font-size:16px;letter-spacing:-.01em}
.who span{font-size:13px;color:var(--sub)}
.story{font-size:13.5px;line-height:1.55;color:#3E3E44;margin:0}
.kh{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#8E8E95;margin:2px 0 6px}
.known{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:5px}
.known li{font-size:13.5px;line-height:1.4;color:#2A2A2F;padding-left:16px;position:relative}
.known li::before{content:'';position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:2px;background:#C9C9CF}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{font-size:11.5px;font-weight:600;color:var(--sub);background:rgba(20,20,22,.06);border-radius:99px;padding:4px 9px}
.note{font-size:12px;color:var(--sub);line-height:1.5;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.lrow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.4}
.lrow:first-child{border-top:0;padding-top:0}
.lrow .k{width:100px;flex-shrink:0;color:var(--mut);font-weight:600}
.lrow.new{animation:flash 1.2s ease}
.lrow .v{display:flex;flex-direction:column;gap:3px;min-width:0}
.la{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ok)}
.lempty{font-size:13px;color:var(--sub);line-height:1.5;margin:0}
@keyframes flash{0%{background:rgba(46,139,87,.14)}100%{background:transparent}}

/* ───────── placeholder product box ───────── */
.pbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex-shrink:0;background:linear-gradient(180deg,#F6F6F8,#ECECEF);box-shadow:inset 0 0 0 1px rgba(0,0,0,.045);border-radius:14px;padding:6px;position:relative}
.pbox .br{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9A9AA1;line-height:1}
.pbox .pn{font-size:13px;font-weight:600;color:#56565D;margin-top:5px;line-height:1.2;letter-spacing:-.01em}
.pbox.lg{width:176px;height:112px;border-radius:24px;padding:12px}
.pbox.lg .br{font-size:11px;letter-spacing:.16em}
.pbox.lg .pn{font-size:16.5px;margin-top:7px}
.pbox.md{width:60px;height:60px;border-radius:15px}
.pbox.sm{width:44px;height:44px;border-radius:12px}
.pbox.sm .br{font-size:8px;letter-spacing:.08em}
.pbox.im{background:#fff;padding:0;overflow:hidden}
.pbox.im img{width:100%;height:100%;object-fit:contain;display:block}

/* ───────── phone ───────── */
.phone{position:relative;height:clamp(560px,calc(100vh - 104px),860px);aspect-ratio:402/874;border-radius:68px;padding:12px;background:linear-gradient(145deg,#5A5A5F,#1F1F22 30%,#2B2B2F 70%,#6A6A70);box-shadow:0 50px 100px -20px rgba(0,0,0,.35),0 30px 60px -30px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.14)}
.phone::before{content:"";position:absolute;inset:3px;border-radius:65px;background:#050506}
.phone .btn{position:absolute;width:4px;border-radius:3px;background:linear-gradient(90deg,#2A2A2E,#4A4A50)}
.phone .b1{left:-3px;top:17%;height:5%}.phone .b2{left:-3px;top:25%;height:8%}.phone .b3{left:-3px;top:35%;height:8%}.phone .b4{right:-3px;top:28%;height:12%}
.screen{position:relative;width:100%;height:100%;border-radius:56px;overflow:hidden;background:#fff;isolation:isolate;z-index:1}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:31%;height:34px;border-radius:99px;background:#000;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:4px 32px 0 36px;font-size:16px;font-weight:600;z-index:55;pointer-events:none;color:#000;background:linear-gradient(#fff 72%,rgba(255,255,255,0))}
.status .r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:36%;height:5px;border-radius:99px;background:#000;z-index:60}
.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.phone .scroll{padding-top:52px}

/* ───────── desktop browser ───────── */
.browser{position:relative;width:min(1180px,calc(100vw - 56px));height:clamp(520px,calc(100vh - 104px),780px);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 40px 90px -20px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.08)}
.bchrome{height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F2F1EF;border-bottom:1px solid rgba(0,0,0,.07)}
.bchrome .d{width:12px;height:12px;border-radius:99px}
.bchrome .d:nth-child(1){background:#FF5F57}.bchrome .d:nth-child(2){background:#FEBC2E}.bchrome .d:nth-child(3){background:#28C840}
.bchrome .url{margin-left:18px;flex:1;max-width:520px;height:28px;border-radius:8px;background:#fff;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:7px;padding:0 12px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.browser .screen{position:absolute;top:44px;left:0;right:0;bottom:0;border-radius:0;width:auto;height:auto}
.browser .scroll{padding-top:0}

/* ───────── shop thank-you page ───────── */
.shop{font-size:14px;color:#1B1B1F;background:#fff;min-height:100%}
.s-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #EEEEF0}
.wm{font-size:20px;color:#141416;line-height:1}
.wm-a4r{font-family:"Archivo","Arial Black",var(--sys);font-style:italic;font-weight:800;letter-spacing:-.04em}
.wm-a4r b{color:var(--a)}
.wm-wlr{font-family:"Barlow Condensed","Arial Narrow",var(--sys);font-weight:700;letter-spacing:.2em;font-size:21px}
.wm-hgl{font-family:"Bitter",Georgia,serif;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.wm-hgl small{font-family:var(--sys);font-size:9.5px;letter-spacing:.24em;font-weight:600;color:var(--a)}
.wm-kp{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:700;font-size:22px;letter-spacing:-.01em}
.wm-kp b{color:var(--a)}
.wm-bh{font-family:"Sora",var(--sys);font-weight:700;letter-spacing:.08em;font-size:18px}
.wm-bh b{color:var(--a);font-weight:700}
.wm-own{font-family:var(--sys);font-weight:800;letter-spacing:-.035em;display:flex;align-items:center;gap:8px}
.wm-own i{width:20px;height:20px;border-radius:min(var(--r),7px);background:var(--a);display:block}
.s-body{padding:22px 20px 120px}
.conf{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.ring{width:46px;height:46px;border-radius:99px;border:2px solid var(--a);color:var(--a);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.s-mut{color:#707075;font-size:13px}
.conf h1{margin:2px 0 0;font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.mapcard{border:1px solid #E6E6E9;border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.mapcard svg{display:block;width:100%;height:124px}
.mapfoot{padding:13px 15px}
.mapfoot b{display:block;font-size:15px;margin-bottom:2px}
.mapfoot span{color:#707075;font-size:13.5px}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid #E6E6E9;border-radius:var(--r);padding:12px 14px;margin-bottom:14px;background:#fff;transition:transform .15s var(--spring),box-shadow .2s}
.gcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.06)}
.gcard:active{transform:scale(.985)}
.gcard b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.gcard span{display:block;font-size:13px;color:#707075;margin-top:2px}
.gcard .chev{margin-left:auto;color:#B0B0B6}
.s-box{border:1px solid #E6E6E9;border-radius:var(--r);padding:15px;margin-bottom:14px}
.s-box h3{margin:0 0 12px;font-size:15px;font-weight:600}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.dgrid div{font-size:13px;color:#707075;line-height:1.5;overflow-wrap:anywhere}
.dgrid div b{display:block;color:#1B1B1F;font-weight:600;font-size:13px;margin-bottom:1px}
.gift{margin-top:12px;padding:10px 12px;border-radius:calc(var(--r) - 2px);background:#F6F6F7;font-size:13px;color:#555}
.prow{display:flex;align-items:center;gap:12px}
.qty{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:#6E6E73;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 5px}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14px;font-weight:600}
.prow .nm span{font-size:12.5px;color:#707075}
.prow .pr{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tot{display:flex;justify-content:space-between;font-size:13.5px;color:#707075;margin-top:10px;font-variant-numeric:tabular-nums}
.tot.big{color:#1B1B1F;font-size:16px;font-weight:700;margin-top:12px;padding-top:12px;border-top:1px solid #EEEEF0}
.tot.big small{font-size:11px;color:#8A8A90;font-weight:500;margin-right:6px}
.s-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:6px}
.s-foot span{font-size:13px;color:#707075}
.s-foot span u{color:var(--a);text-decoration:none;font-weight:500}
.cta{height:48px;padding:0 22px;border-radius:var(--r);background:var(--a);color:#fff;font-size:14.5px;font-weight:600}
.phone .s-foot{flex-direction:column-reverse;align-items:stretch}
.phone .cta{width:100%}
.dshop .s-head{padding:18px 40px}
.dsplit{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);min-height:calc(100% - 60px)}
.dleft{padding:34px 40px 60px;max-width:640px;justify-self:end;width:100%}
.dright{background:#F6F6F7;border-left:1px solid #ECECEE;padding:34px 40px}
.dright .s-box{border:0;padding:0;background:transparent}

/* ───────── emails ───────── */
.mail{background:#fff;min-height:100%;font-size:14px}
.m-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;color:#0A7AFF;font-size:17px}
.m-nav .l{display:flex;align-items:center;gap:2px}
.m-nav .r{display:flex;gap:18px}
.m-meta{display:flex;align-items:center;gap:12px;padding:8px 18px 6px}
.av{width:40px;height:40px;border-radius:99px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0}
.m-meta b{display:block;font-size:15.5px}
.m-meta span{font-size:13px;color:#8A8A90}
.m-subj{margin:10px 18px 14px;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.m-email{margin:0 12px 110px;border-radius:16px;border:1px solid #ECECEE;overflow:hidden}
.m-band{padding:16px;display:flex;justify-content:center;border-bottom:1px solid #F0F0F2}
.m-hero{padding:22px 20px 18px;text-align:center}
.m-ico{width:50px;height:50px;border-radius:99px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:var(--a);background:color-mix(in srgb,var(--a) 10%,#fff)}
.m-hero h2{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
.m-hero p{margin:0 auto 16px;color:#6B6B72;line-height:1.5;max-width:34ch}
.m-btn{display:inline-block;background:var(--a);color:#fff;border-radius:var(--r);padding:11px 20px;font-weight:600;font-size:14px}
.m-sec{padding:0 16px 16px}
.m-sec .prow{padding:12px;border-radius:14px;background:#F7F7F8}
.m-foot{padding:14px 18px 20px;font-size:11.5px;color:#9A9AA0;text-align:center;line-height:1.55;border-top:1px solid #F0F0F2}
.browser .mail{max-width:720px;margin:0 auto}
/* the guide, built into the email */
.ecard{margin-top:12px;border:1px solid #E6E6EA;border-radius:16px;padding:14px 14px 0;background:#fff;text-align:left}
.ech{display:flex;align-items:center;gap:11px;padding-bottom:10px}
.ech b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.015em}
.ech span{display:block;font-size:12px;color:#8A8A90;margin-top:1px}
.etags{display:flex;flex-wrap:wrap;gap:5px;padding:0 0 11px}
.etags span{font-size:11.5px;font-weight:600;color:var(--a);background:color-mix(in srgb,var(--a) 9%,#fff);border-radius:99px;padding:3px 9px}
.erow{display:flex;gap:11px;padding:10px 0;border-top:1px solid #F0F0F2;font-size:13.5px;line-height:1.45;color:#3A3A40}
.erow .i{color:#56565D;margin-top:1px}
.erow b{color:#141416;font-weight:600}
.efoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0 12px;border-top:1px solid #F0F0F2}
.elink{display:flex;align-items:center;gap:3px;font-size:13.5px;font-weight:600;color:var(--a);white-space:nowrap}
.efoot .pb{white-space:nowrap;font-size:10.5px}
.pb{font-size:11px;color:#AFAFB5;text-align:center;letter-spacing:.01em}
.pb b{font-weight:600;color:#8E8E95}
.efoot .pb{text-align:right}

/* ───────── the pop-up ───────── */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .5s ease}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:50;background:#fff;border-radius:46px;box-shadow:0 12px 36px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.06);transform:translateY(calc(100% + 40px));transition:transform .56s var(--spring),height .3s cubic-bezier(.2,.8,.2,1),opacity .3s ease;max-height:calc(100% - 64px);display:flex;flex-direction:column;overflow:hidden;--a:#141416;contain:layout paint;will-change:transform}
.sheet.open{transform:translateY(0)}
.browser .sheet{left:50%;right:auto;bottom:auto;top:50%;width:400px;margin-left:-200px;border-radius:30px;transform:translateY(-44%) scale(.94);opacity:0;max-height:calc(100% - 56px)}
.browser .sheet.open{transform:translateY(-50%) scale(1);opacity:1}
.sh-ctl{position:absolute;top:15px;left:15px;right:15px;height:32px;display:flex;align-items:center;justify-content:space-between;z-index:4;pointer-events:none}
.rb{width:32px;height:32px;border-radius:99px;background:#F0F0F2;color:#85858C;display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:opacity .25s,background .2s}
.rb:hover{background:#E6E6E9}
.rb.hide{opacity:0;pointer-events:none}
.prog{display:flex;gap:5px;transition:opacity .25s}
.prog span{width:20px;height:4px;border-radius:99px;background:#E4E4E8;transition:background .35s}
.prog span.on{background:var(--ink)}
.prog.hide{opacity:0}
.pw{overflow-y:auto;scrollbar-width:none;flex:1;overscroll-behavior:contain}
.pw::-webkit-scrollbar{display:none}
@keyframes inR{from{opacity:0;transform:translate3d(18px,0,0)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translate3d(-18px,0,0)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.9) translateY(6px)}60%{opacity:1;transform:scale(1.02)}100%{transform:none}}
@keyframes draw{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
@keyframes ringin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.hero{text-align:center}
.hero .pbox.lg{margin:0 auto;animation:pop .6s var(--spring) both}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--a);margin-top:14px}
.hero h2{margin:3px 0 0;font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.14;text-wrap:balance}
.hook{font-size:17px;font-weight:650;line-height:1.3;color:#1B1B1F;letter-spacing:-.015em;margin:12px auto 0;max-width:28ch;text-wrap:balance}
.hook+.lead{margin-top:6px}
.lead{font-size:15px;line-height:1.47;color:#66666D;margin:8px auto 0;max-width:33ch;text-wrap:pretty}
.meta{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:#8E8E95;font-weight:500}
.ph{display:flex;align-items:center;gap:12px}
.ph h2{margin:0;font-size:20px;text-wrap:balance;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.ph .sub{font-size:12.5px;color:#8E8E95;margin-top:2px}
.kl{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;animation:rise .45s .04s var(--spring) both}
.kl li{position:relative;padding-left:16px;font-size:15px;line-height:1.45;color:#48484E}
.kl li::before{content:"";position:absolute;left:1px;top:.7em;width:7px;height:1.6px;border-radius:2px;background:#B8B8BE}
.kl li b{color:#141416;font-weight:600}
.dyk{display:flex;gap:12px;margin-top:14px;padding:13px 14px;border-radius:16px;background:var(--fill);font-size:14.5px;line-height:1.45;color:#48484E;animation:rise .45s .1s var(--spring) both}
.dyk .i{color:var(--ink);margin-top:1px}
.dyk b{color:#141416;font-weight:600}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -22px 0;padding:0 22px;scroll-padding:0 22px;scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab}
.car::-webkit-scrollbar{display:none}
.car.drag{scroll-snap-type:none;cursor:grabbing}
.tc{flex:0 0 78%;scroll-snap-align:start;padding:15px 15px 16px;border-radius:18px;background:var(--fill);animation:rise .45s var(--spring) both;user-select:none;-webkit-user-select:none}
.tc:nth-child(2){animation-delay:.05s}.tc:nth-child(3){animation-delay:.1s}
.tc .ic{width:34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tc .why{margin-top:11px;font-size:12px;font-weight:600;color:var(--a);letter-spacing:.01em}
.tc .why+h4{margin-top:3px}
.tc h4{margin:11px 0 4px;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.tc p{margin:0;font-size:14px;line-height:1.45;color:#5A5A61}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.cdots button{width:6px;height:6px;border-radius:99px;background:#D6D6DB;transition:all .3s var(--spring)}
.cdots button.on{width:16px;background:#8E8E95}
.qeye{font-size:12.5px;font-weight:600;color:var(--a);margin-bottom:4px}
.pgt h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.18;text-wrap:balance}
.pgt .sub{font-size:14.5px;color:#6B6B72;margin-top:5px;line-height:1.4}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.chip{display:flex;align-items:center;gap:12px;width:100%;padding:14px 15px;border-radius:15px;background:var(--fill);font-size:16px;font-weight:500;text-align:left;border:2px solid transparent;transition:background .18s,border-color .18s,transform .15s var(--spring);animation:rise .4s var(--spring) both}
.chip:nth-child(2){animation-delay:.04s}.chip:nth-child(3){animation-delay:.08s}.chip:nth-child(4){animation-delay:.12s}
.chip:hover{background:#EDEDF0}
.chip:active{transform:scale(.98)}
.chip span{flex:1}
.chip small{font-size:13px;color:#8E8E95;font-weight:500}
.chip .ck{flex:0 0 auto;width:22px;height:22px;border-radius:99px;border:1.8px solid #CFCFD4;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .2s}
.chip.sel{background:#fff;border-color:var(--a)}
.chip.sel .ck{background:var(--a);border-color:var(--a)}
.slider{margin-top:18px}
.slv{text-align:center;font-size:30px;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.sld{text-align:center;font-size:14px;margin-top:2px;min-height:20px;font-weight:600}
.sld.ok{color:var(--ok)}.sld.warn{color:var(--warn)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:8px 0 0;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--a) var(--p),#E4E4E8 var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--a) var(--p),#E4E4E8 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:99px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.08);margin-top:-12px;cursor:grab}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:99px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.22);cursor:grab}
.sle{display:flex;justify-content:space-between;font-size:12px;color:#A3A3AA;margin-top:1px}
.badge{width:58px;height:58px;border-radius:99px;margin:0 auto;display:flex;align-items:center;justify-content:center;animation:ringin .5s var(--spring) both}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge path{stroke-dasharray:40;animation:draw .55s .2s ease both}
.echo{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:#6B6B72;background:var(--fill);border-radius:99px;padding:5px 11px 5px 9px;font-weight:500}
.ans h2{margin:10px 0 0;font-size:21px;font-weight:700;letter-spacing:-.03em;line-height:1.2;text-wrap:balance}
.ans .kl{text-align:left}
.done-mark{width:70px;height:70px;margin:0 auto;border-radius:99px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;animation:ringin .55s var(--spring) both;box-shadow:0 12px 28px color-mix(in srgb,var(--a) 35%,transparent)}
.done-mark path{stroke-dasharray:40;animation:draw .55s .25s ease both}
.sent{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:14px;color:#46464C;animation:rise .35s var(--spring) both}
.sent .i{color:var(--ok)}
.foot{margin-top:20px}
.primary{width:100%;height:52px;border-radius:16px;background:var(--a);color:#fff;font-size:16.5px;font-weight:600;letter-spacing:-.01em;transition:transform .15s var(--spring),filter .2s}
.primary:hover{filter:brightness(1.08)}
.primary:active{transform:scale(.98);transition-duration:.05s}
button,[data-act],.csl{touch-action:manipulation}
.tap:active,.chip:active,.remind:active,.gcard:active,.abtn:active{transition-duration:.05s}
.secondary{display:block;width:100%;height:42px;margin-top:4px;color:var(--a);font-size:15.5px;font-weight:500;border-radius:13px}
.secondary:hover{background:#F6F6F8}
.sheet .pb{margin-top:10px}


/* usage question */
.ustats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ustat{background:var(--fill);border-radius:16px;padding:12px 14px}
.ustat span{display:block;font-size:12px;color:#77777E;font-weight:600;line-height:1.3}
.ustat b{display:block;font-size:21px;font-weight:700;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;transition:opacity .2s}
.unote{font-size:12px;color:#9A9AA1;margin-top:8px;line-height:1.45}
.remind{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);width:100%;text-align:left;transition:border-color .2s}
.remind .rt{flex:1;min-width:0}
.remind b{display:block;font-size:14.5px;font-weight:600}
.remind span{font-size:12.5px;color:#77777E}
.tgl{width:44px;height:26px;border-radius:99px;background:#E4E4E8;position:relative;flex-shrink:0;transition:background .25s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--spring)}
.remind.on{border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.remind.on .tgl{background:var(--ok)}
.remind.on .tgl::after{transform:translateX(18px)}


/* ───────── smooth slider ───────── */
.csl{position:relative;height:46px;margin:6px 6px 0;touch-action:none;cursor:pointer;-webkit-user-select:none;user-select:none;outline:none;--p:0}
.csl-track{position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;border-radius:99px;background:#E4E4E8;overflow:hidden}
.csl-fill{position:absolute;inset:0;background:var(--a);transform-origin:left center;transform:scaleX(var(--p));transition:transform .3s var(--spring);will-change:transform}
.csl-rail{position:absolute;inset:0;pointer-events:none;transform:translate3d(calc(var(--p) * 100%),0,0);transition:transform .3s var(--spring);will-change:transform}
.csl.drag .csl-rail{transition:none}
.csl-thumb{position:absolute;top:50%;left:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:99px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.08);transition:scale .2s var(--spring),box-shadow .2s}
.csl.drag .csl-fill{transition:none}
.csl.drag .csl-thumb{transition:scale .2s var(--spring),box-shadow .2s;scale:1.14;box-shadow:0 8px 20px rgba(0,0,0,.24),0 0 0 .5px rgba(0,0,0,.08)}
.csl:focus-visible .csl-thumb{outline:2px solid #2F6FED;outline-offset:2px}
.csl-dots{position:absolute;left:0;right:0;top:calc(50% + 11px);height:4px;pointer-events:none}
.csl-dots span{position:absolute;width:4px;height:4px;margin-left:-2px;border-radius:99px;background:#D6D6DB}
.slv.tick{animation:tick .24s var(--spring)}
@keyframes tick{from{transform:translateY(6px);opacity:.35}to{transform:none;opacity:1}}
.sld{transition:color .25s}

/* ───────── micro-animations ───────── */
.kl{animation:none}
.kl li{animation:rise .42s var(--spring) backwards}
.kl li:nth-child(2){animation-delay:.07s}.kl li:nth-child(3){animation-delay:.14s}
.tc{animation:rise .45s var(--spring) backwards;transition:opacity .35s ease,transform .35s var(--spring)}
.car .tc:not(.act){opacity:.5;transform:scale(.965)}
.chips.picked .chip:not(.sel){opacity:.4;transform:scale(.98)}
.chip{transition:background .18s,border-color .18s,transform .2s var(--spring),opacity .25s}
.chip.sel .ck{animation:pop .4s var(--spring)}
.prog span{position:relative;overflow:hidden;background:#E4E4E8}
.prog span.on{background:#E4E4E8}
.prog span::after{content:"";position:absolute;inset:0;background:var(--ink);border-radius:99px;transform:scaleX(0);transform-origin:left center;transition:transform .5s var(--spring)}
.prog span.on::after{transform:scaleX(1)}
.remind:active{transform:scale(.985)}
.remind{transition:border-color .2s,background .25s,transform .15s var(--spring)}
.remind.on{background:color-mix(in srgb,var(--ok) 6%,#fff)}
.gcard .chev{transition:transform .25s var(--spring)}
.gcard:hover .chev{transform:translateX(3px)}
.echo{animation:rise .4s .08s var(--spring) backwards}
.ans h2{animation:rise .4s .12s var(--spring) backwards}
.primary{position:relative;overflow:hidden}

/* experience level */
.lvl{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--fill);border-radius:12px;padding:3px;margin-top:14px;--i:0}
.lvl-pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / 3);border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04);transform:translate3d(calc(var(--i) * 100%),0,0);transition:transform .32s var(--spring)}
.lvl button{position:relative;z-index:1;font-size:13.5px;font-weight:500;color:var(--sub);padding:8px 4px;border-radius:9px;transition:color .2s}
.lvl button.on{color:var(--ink);font-weight:600}
.car.out{opacity:0;transition:opacity .09s linear}
.lvtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.lvt{background:#F6F6F8;border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.lvt span{font-size:13px;color:#55555C;font-weight:600}
.lvt b{font-size:26px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lvt .abtn{margin-top:4px;height:auto;min-height:34px;padding:7px 12px;white-space:normal;text-align:left;line-height:1.3}
@media (max-width:900px){.lvtiles{grid-template-columns:1fr}}

/* level question on the first screen */
.lq{margin-top:18px}
.lq.tl{margin-top:16px}
.lvrows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.lvrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:13px 14px;border-radius:14px;background:var(--fill);text-align:left;transition:background .18s,transform .15s}
.lvrow:hover{background:#EDEDF0}.lvrow:active{transform:scale(.985)}
.lvrow b{font-size:15.5px;font-weight:650;white-space:nowrap}
.lvrow span{font-size:13.5px;color:#7A7A81;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvrow .i{color:#B4B4BA}
.lvsw{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;padding:3px;border-radius:12px;background:var(--fill)}
.lvsw button{position:relative;z-index:1;height:34px;font-size:14px;font-weight:600;color:#77777E;border-radius:9px;transition:color .25s}
.lvsw button.on{color:#141416}
.lvpill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);transform:translateX(calc(var(--i)*100%));transition:transform .35s cubic-bezier(.32,.72,0,1)}
.lq.tl .lqq{text-align:left;font-size:15px}
.tlhint{font-size:13px;color:#8A8A90;margin-top:12px}
.car.in .tc{animation:tcIn .42s cubic-bezier(.32,.72,0,1) backwards}
.car.in .tc:nth-child(2){animation-delay:.05s}
@keyframes tcIn{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.lqq{font-size:15.5px;font-weight:650;text-align:center;letter-spacing:-.01em}
.lqs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px}
.lqb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px 11px;border-radius:15px;background:var(--fill);border:2px solid transparent;text-align:center;transition:background .2s,border-color .2s,opacity .25s}
.lqb b{font-size:14.5px;font-weight:650}
.lqb span{font-size:11.5px;line-height:1.3;color:#77777E}
.lqb:hover{background:#EDEDF0}
.lqb.sel{background:#fff;border-color:var(--a)}
.lqs.picked .lqb:not(.sel){opacity:.45}
.lqn{font-size:12px;color:#9A9AA1;text-align:center;margin-top:10px}
/* answer shown in place */
.ansb{margin-top:12px;border-radius:16px;padding:13px 14px;background:var(--fill)}
.ansb .ah{display:flex;gap:9px;align-items:flex-start;font-size:15px;line-height:1.35;letter-spacing:-.01em}
.ansb.ok .ah .i{color:var(--ok)}.ansb.warn .ah .i{color:var(--warn)}
.ansb .kl{margin-top:9px;gap:6px}
.ansb .kl li{font-size:14px}
.chip.picked1{margin-top:14px;cursor:pointer}
.chip .chg{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--a)}
/* calm motion: one transition per screen */
.kl li,.tc,.chip,.echo,.ans h2,.dyk,.kl,.hero .pbox.lg{animation:none!important}
.car .tc:not(.act){opacity:.55;transform:none}
.tc{transition:opacity .4s ease}
.sheet{transition:transform .6s var(--spring),opacity .3s ease}
/* pager: each page keeps its own natural height; the card follows it in the same motion as the slide.
   Pages are bottom-anchored layers, so the buttons stay put and a height change never re-lays out a page. */
.sheet{transition:transform .6s var(--spring),opacity .3s ease,height .52s cubic-bezier(.32,.72,0,1)}
.sheet.nohx{transition:transform .6s var(--spring),opacity .3s ease}
.pw{position:relative;overflow:hidden;flex:1 1 auto;min-height:0}
.pw .pg{position:absolute;left:0;right:0;bottom:0;max-height:var(--mh,600px);padding:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;background:#fff;contain:layout paint style}
.pw .pg.lv{will-change:transform}
.pw .pg::-webkit-scrollbar{display:none}
.pw .pg.lv{pointer-events:none}
.pgi{padding:60px 22px 20px}
.chip.lvc .lt{display:flex;flex-direction:column;gap:2px}
.chip.lvc .lt b{font-weight:600;font-size:16px}
.chip.lvc .lt small{font-size:13.5px;color:#8E8E95;font-weight:500}

/* ───────── shop side (admin) ───────── */
.admin{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100%;background:#F6F6F7;font-size:14px;color:#1B1B1F}
.anav{background:#fff;border-right:1px solid #ECECEE;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.alogo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:-.02em;padding:2px 8px 18px}
.alogo .mk{width:24px;height:24px;border-radius:7px;background:#141416;color:#fff;display:flex;align-items:center;justify-content:center}
.anav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:14px;color:#55555C;font-weight:500;text-align:left}
.anav button:hover{background:#F6F6F8}
.anav button.on{background:#F1F1F3;color:#141416;font-weight:600}
.ashop{margin-top:auto;padding:14px 8px 4px;border-top:1px solid #F0F0F2}
.ashop .wm{font-size:16px}
.amain{padding:28px 34px 70px;max-width:900px;width:100%}
.ahead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.aeye{font-size:12.5px;font-weight:600;color:var(--a);margin-bottom:4px}
.ah1{font-size:25px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.15;text-wrap:balance}
.asub{color:#66666D;margin:7px 0 22px;font-size:14.5px;line-height:1.5;max-width:62ch}
.apill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:5px 10px;background:#F1F1F3;color:#55555C;white-space:nowrap}
.apill.ok{background:var(--okbg);color:var(--ok)}
.acard{background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);padding:18px 20px;margin-bottom:14px}
.acard h3{margin:0;font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.acard .hint{font-size:13px;color:#77777E;margin-top:3px;line-height:1.5}
.step{display:flex;gap:14px}
.snum{width:28px;height:28px;border-radius:99px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:#F1F1F3;color:#55555C}
.snum.done{background:var(--ok);color:#fff}
.sbody{flex:1;min-width:0}

/* ───────── card height without layout ─────────
   The sheet box keeps one fixed height. What you see as the card is drawn by three white pieces
   (top cap, stretchable middle, bottom cap) and clipped by two nested layers that move in opposite
   directions. Growing or shrinking the card is therefore pure transform work on the compositor:
   no layout, no repaint, in every frame of the animation. */

/* ───────── smooth slider: follows the finger, snaps to steps on release ───────── */
function sliderHTML(id,min,max,val,label){
  const p=(val-min)/(max-min),n=max-min;
  return `<div class="csl" id="${id}" role="slider" tabindex="0" aria-label="${label}" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${val}" data-min="${min}" data-max="${max}" data-val="${val}" style="--p:${p}">
    <div class="csl-track"><div class="csl-fill"></div></div>
    ${n<=10?`<div class="csl-dots">${Array.from({length:n+1},(_,i)=>`<span style="left:${i/n*100}%"></span>`).join('')}</div>`:''}
    <div class="csl-rail"><div class="csl-thumb"></div></div></div>`;
}
function bindSliders(root){
  (root||document.getElementById('pw')).querySelectorAll('.csl').forEach(el=>{
    const min=+el.dataset.min,max=+el.dataset.max;let val=+el.dataset.val,drag=false,raf=0,px=0;
    const setP=p=>el.style.setProperty('--p',p);
    const step=v=>{if(v===val)return;val=v;el.setAttribute('aria-valuenow',v);sliderStep(el.id,v)};
    const fromX=x=>{const r=el.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))};
    const frame=()=>{raf=0;const p=fromX(px);setP(p);step(Math.round(min+p*(max-min)))};
    el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();drag=true;el.classList.add('drag');try{el.setPointerCapture(e.pointerId)}catch(_){}px=e.clientX;frame()});
    el.addEventListener('pointermove',e=>{if(!drag)return;px=e.clientX;if(!raf)raf=requestAnimationFrame(frame)});
    const end=()=>{if(!drag)return;drag=false;if(raf){cancelAnimationFrame(raf);frame()}el.classList.remove('drag');setP((val-min)/(max-min));sliderCommit(el.id,val)};
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('lostpointercapture',end);
    el.addEventListener('keydown',e=>{const d=(e.key==='ArrowRight'||e.key==='ArrowUp')?1:(e.key==='ArrowLeft'||e.key==='ArrowDown')?-1:0;if(!d)return;e.preventDefault();
      const v=Math.max(min,Math.min(max,val+d));step(v);setP((v-min)/(max-min));sliderCommit(el.id,v)});
  });
}

        try{$('shcb').setPointerCapture(e.pointerId)}catch(_){}}}
    moved=true;
    if(axis==='y'&&dy>0&&(curPage()?.scrollTop||0)<=0&&S.view==='phone'){sh.style.transition='none';sh.style.transform=`translateY(${dy}px)`}
    if(axis==='x'){dx=ddx;hist.push([e.timeStamp,e.clientX]);if(hist.length>6)hist.shift();if(!raf)raf=requestAnimationFrame(paint)}
  });
  const end=e=>{
    if(!active)return;active=false;const dy=e.clientY-sy;
    if(raf){cancelAnimationFrame(raf);raf=0}
    if(axis==='y'&&S.view==='phone'){sh.style.transition='';if(dy>120)closeSheet();else sh.style.transform=''}
    if(axis==='x'&&cur){
      dragging=false;$('sheet').classList.remove('nohx');
      const hh=hist[0],v=(e.clientX-hh[1])/Math.max(1,e.timeStamp-hh[0]); // px per ms
      const go=tgt!=null&&Math.sign(dx)===-dir&&(Math.abs(dx)>W*.28||(Math.abs(v)>.35&&Math.sign(v)===-dir));
      if(go){const el=adj;el.classList.remove('lv');el.style.transform='';const from=dx;
        S.step=tgt;swapIn(el,dir,from);
        if(steps()[S.step]==='expect'||steps()[S.step]==='tips')setTimeout(renderLearned,400)}
      else{const x=cur.style.transform,c0=cur,a0=adj;
        setH(h0,true);const back=c0.animate([{transform:x},{transform:'translate3d(0,0,0)'}],{duration:340,easing:EASE});
        const fin=()=>{c0.style.transform='';c0.style.willChange='';if(a0)a0.remove();navAnims=[];schedulePre()};
        if(a0)a0.animate([{transform:a0.style.transform},{transform:`translate3d(${dir*W}px,0,0)`}],{duration:340,easing:EASE,fill:'forwards'});
        c0.style.transform='';back.onfinish=fin;back.oncancel=fin;navAnims=[back]}
      adj=null;cur=null;dx=0;
    }
    if(moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault()};sh.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>sh.removeEventListener('click',stop,{capture:true}),50)}
    axis=null;
  };
  sh.addEventListener('pointerup',end);
  sh.addEventListener('pointercancel',e=>{if(axis==='x'&&cur){end(e);return}dragging=false;sh.classList.remove('nohx');active=false;axis=null;sh.style.transition='';sh.style.transform=''});
}

/* ───────── content engine: with ?engine=…&pk=…&product=… the guide from the AmplifAI content engine (public API) becomes one more customer ───────── */
function fromEngine(d){
  const g=d.guide,pg=d.product,e=x=>x&&{en:escH(x.en??x.nl),nl:escH(x.nl??x.en)},has=x=>x&&(x.nl||x.en);
  const shop=escH(d.shop.name),name=escH(pg.name||''),brand=escH(pg.brand||'');
  const pname=brand&&name.toLowerCase().startsWith(brand.toLowerCase())?name.slice(brand.length).trim():name;
  const tip=t=>({icon:t.icon,t:e(t.title),d:e(t.text)});
  const opts=g.q.options;
  const c={
    vert:'sport',shop,wm:`<span class="wm wm-own"><i></i>${shop}</span>`,domain:escH(d.shop.domain||""),accent:d.shop.accent||'#1F5BD6',r:12,initial:shop[0],
    chip:T('Your URL','Jouw URL'),first:'Sam',full:'Sam Jansen',order:'#AI-10001',brand,pname,product:name,short:e(g.short),img:pg.image?escH(pg.image):null,
    variant:T(escH(pg.variants?.[0]||''),escH(pg.variants?.[0]||'')),price:escH(pg.price||''),
    eta:T('Thursday 1 October','donderdag 1 oktober'),dateD:T('Thu 1 Oct','do 1 okt'),
    email:'sam@voorbeeld.nl',street:'Voorbeeldstraat 1',city:'1011 AB Amsterdam',
    tag:T('From your URL','Uit jouw URL'),brief:T(`Generated by the content engine from ${escH(d.shop.domain||"")}.`,`Gemaakt door de content engine, uit ${escH(d.shop.domain||"")}.`),
    known:[T(`Product: ${name}`,`Product: ${name}`),...(pg.price?[T(`Price: ${escH(pg.price)}`,`Prijs: ${escH(pg.price)}`)]:[])],
    card:[e(g.card.h),e(g.card.s)],title:e(g.title),hook:e(g.hook),story:e(g.story.text),
    expect:g.expect.map(x=>[e(x.lead),e(x.text)]),fact:{icon:g.fact.icon,text:e(g.fact.text)},
    lq:{q:e(g.lq.q),cap:{new:e(g.lq.new),reg:e(g.lq.reg),pro:e(g.lq.pro)}},
    q:{kind:'chips',eye:e(g.q.eye),title:e(g.q.title),sub:e(g.q.sub),
       opts:opts.map(o=>({v:o.v,l:e(o.label),...(has(o.note)?{s:e(o.note)}:{})})),
       res:Object.fromEntries(opts.map(o=>[o.v,{ok:o.ok?1:0,h:e(o.h),lines:o.lines.map(e)}]))},
    tipsLv:{new:g.tips.new.map(tip),reg:g.tips.reg.map(tip),pro:g.tips.pro.map(tip)},
    tipA:Object.fromEntries(g.answerTips.map(t=>[t.v,{...tip(t),why:e(t.why)}])),
    learn:a=>{const o=opts.find(x=>x.v===a);return o?[[e(g.q.title),e(o.label),T('Tips and emails matched to it','Tips en mails daarop afgestemd')]]:[]},
    shipped:()=>({title:e(g.shipped.title),items:g.shipped.items.map(x=>[x.icon,e(x.lead),e(x.text)])}),
    delivered:()=>({title:e(g.delivered.title),items:g.delivered.items.map(x=>[x.icon,e(x.lead),e(x.text)])}),
  };
  c.tips=c.tipsLv.reg;
  if(d.settings?.length==='short')c.single=c.expect;
  return c;
}
const wantC=new URLSearchParams(location.search).get('c');
if(wantC&&C[wantC])S.cust=wantC;
const EP=new URLSearchParams(location.search),engineUrl=EP.get('engine');
if(EP.get('embed')==='1'){document.documentElement.classList.add('embed');S.view='phone'}
const engineLoad=engineUrl&&EP.get('pk')&&EP.get('product')
  ?fetch(`${engineUrl.replace(/\/$/,'')}/v1/public/guide?${new URLSearchParams({key:EP.get('pk'),product:EP.get('product'),...(EP.get('preview')&&{preview:EP.get('preview')})})}`,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
     if(!d||!d.guide)return;C.eng=fromEngine(d);if(!ORDER.includes('eng'))ORDER.push('eng');if(wantC==='eng')S.cust='eng'}).catch(()=>{})
  :Promise.resolve();
// the content studio asks for a refresh after an edit: redraw in place, on the same step
window.addEventListener('message',e=>{
  if(e.data?.type!=='amplifai:refresh'||!engineUrl)return;
  const q=new URLSearchParams({key:EP.get('pk'),product:EP.get('product'),...(EP.get('preview')&&{preview:EP.get('preview')})});
  fetch(`${engineUrl.replace(/\/$/,'')}/v1/public/guide?${q}`,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
    if(!d?.guide)return;C.eng=fromEngine(d);if(S.cust==='eng'){renderBar();renderDevice(true)}}).catch(()=>{});
});
// asked for the engine's product: wait for it, so the guide opens once
if(wantC==='eng')engineLoad.then(()=>{renderBar();renderDevice()});
else{renderBar();renderDevice();engineLoad.then(()=>{if(C.eng)renderBar()})}
